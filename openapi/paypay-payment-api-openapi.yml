    AuthorizationExpiry:
      type: integer
      format: EpochTime
      x-description-en: 'Epoch timestamp in seconds. The expiry duration must be less than the expiry granted to the merchant.


        Note:

        The expiry, in case of authorization with PAY_LATER_CC, is subject to be shortened

        under special circumstances such as user has cancelled PayLater, etc.

        In such cases, PayPay will notify merchant in advance of an updated (shortened) the expiry

        before merchant''s authorization period expires via webhook notification (see the section

        [Transaction Events > AUTHORIZED | Create a payment authorization](#tag/Transaction-Events/AUTHORIZED-or-Create-a-payment-authorization)).

        It is suggested for merchant to implement proper handling

        after consuming such an event to avoid capture failure.

        '
      x-description-jp: 'エポックタイムスタンプ（秒単位）。有効期限は、加盟店ごとに許可されている有効期間の範囲内で設定してください。


        注：

        PAY_LATER_CCによるオーソリの場合の有効期間は、

        ユーザーがPayPay（クレジット）をキャンセルしたなどの特別な状況下で短縮される可能性があります。

        このような場合、PayPayはWebhook通知により、 加盟店のオーソリ期間が切れる前に有効期間の更新（短縮）を事前に加盟店に通知します

        （「[トランザクションイベント > AUTHORIZED | Create a payment authorization](#tag/トランザクションイベント/AUTHORIZED-or-Create-a-payment-authorization)

        」セクションを参照）。

        キャプチャーの失敗を避けるために、加盟店はこのようなイベントを受信した後、適切な処理を実装することをお勧めします。

        '
      description: 'Epoch timestamp in seconds. The expiry duration must be less than the expiry granted to the merchant.


        Note:

        The expiry, in case of authorization with PAY_LATER_CC, is subject to be shortened

        under special circumstances such as user has cancelled PayLater, etc.

        In such cases, PayPay will notify merchant in advance of an updated (shortened) the expiry

        before merchant''s authorization period expires via webhook notification (see the section

        [Transaction Events > AUTHORIZED | Create a payment authorization](#tag/Transaction-Events/AUTHORIZED-or-Create-a-payment-authorization)).

        It is suggested for merchant to implement proper handling

        after consuming such an event to avoid capture failure.

