name: PayPay
description: >-
  PayPay is Japan's largest QR/barcode mobile-payment network (a SoftBank / Yahoo
  Japan / Paytm joint venture) with tens of millions of users. Its Open Payment API
  (OPA v2) lets payment partners and merchants collect payments from PayPay wallet
  users through dynamic QR codes, web checkout (Web Cashier), app-invoke deep links,
  and a pre-authorize-and-capture flow. The REST API (base //apigw.paypay.ne.jp) is
  secured with HMAC-SHA256 request signatures, settles in JPY, sends transaction
  webhooks plus daily reconciliation files, and ships official Node, PHP, Python and
  Java SDKs under the github.com/paypay organization.
